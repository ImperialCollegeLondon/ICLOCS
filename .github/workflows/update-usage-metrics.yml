name: Update usage metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usage-metrics
  cancel-in-progress: false

jobs:
  update:
    name: Refresh GitHub usage counters
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update metric files
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/update_github_usage_metrics.py

      - name: Commit metric updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/github-usage.json docs/metrics/clones-badge.json docs/metrics/release-downloads-badge.json
          if git diff --cached --quiet; then
            echo "No metric changes to commit."
          else
            git commit -m "Update GitHub usage metrics"
            git push
          fi
